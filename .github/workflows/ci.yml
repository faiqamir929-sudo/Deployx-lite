name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.26.1"
  DATABASE_URL: postgresql://deployx:deployx@127.0.0.1:5432/deployx
  REDIS_URL: redis://127.0.0.1:6379
  SESSION_SECRET: ci-only-session-secret
  DEPLOYX_STEP_DELAY_MS: "1"
  DEPLOYX_SIMULATED_FAILURE_STEP: success
  CLERK_PUBLISHABLE_KEY: pk_test_ci_only
  CLERK_SECRET_KEY: sk_test_ci_only
  AI_INTEGRATIONS_OPENAI_API_KEY: ci-only-key
  AI_INTEGRATIONS_OPENAI_BASE_URL: https://api.openai.com/v1

jobs:
  quality:
    name: Lint, typecheck, schema, build, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deployx
          POSTGRES_PASSWORD: deployx
          POSTGRES_DB: deployx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deployx -d deployx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint maintained source
        run: pnpm run lint

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Apply PostgreSQL schema
        run: pnpm --filter @workspace/db run push

      - name: Build workspace
        run: pnpm run build

      - name: Run integration tests with the queue worker
        run: pnpm run test

  docker:
    name: Docker ${{ matrix.target }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, web, worker]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        run: |
          docker build \
            --target "${{ matrix.target }}" \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_ci_build_only \
            --build-arg VITE_CLERK_PROXY_URL= \
            --tag "deployx-${{ matrix.target }}:ci" \
            .