name: DeployX E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    # A manual dispatch from a fork must not receive the protected Clerk
    # environment or any other repository secret.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    environment: e2e
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deployx
          POSTGRES_PASSWORD: deployx-ci-only
          POSTGRES_DB: deployx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deployx -d deployx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      DATABASE_URL: postgresql://deployx:deployx-ci-only@127.0.0.1:5432/deployx
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      REDIS_URL: redis://127.0.0.1:6379
      DEPLOYX_SIMULATED_FAILURE_STEP: success
      AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${{ secrets.AI_INTEGRATIONS_OPENAI_BASE_URL }}
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_DEPLOYMENT_TIMEOUT_MS: 120000
      API_PROXY_TARGET: http://127.0.0.1:8080
      API_PORT: 8080
      WEB_PORT: 5173
      PORT: 8080
      BASE_PATH: /
      NODE_ENV: test
      CI: true

    steps:
      - name: Check protected E2E configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY SESSION_SECRET AI_INTEGRATIONS_OPENAI_API_KEY AI_INTEGRATIONS_OPENAI_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing protected E2E secret ${name}"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare database
        run: pnpm --filter @workspace/db run push

      - name: Build and run persisted E2E lifecycle
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build

          pnpm --filter @workspace/api-server run start > /tmp/deployx-e2e-api.log 2>&1 &
          api_pid=$!
          PORT=5173 pnpm --filter @workspace/deployx-lite run dev -- --host 127.0.0.1 > /tmp/deployx-e2e-web.log 2>&1 &
          web_pid=$!
          node ./artifacts/api-server/dist/worker.mjs > /tmp/deployx-e2e-worker.log 2>&1 &
          worker_pid=$!

          cleanup() {
            kill "$worker_pid" "$web_pid" "$api_pid" 2>/dev/null || true
            wait "$worker_pid" "$web_pid" "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          node --input-type=module <<'NODE'
          const urls = [
            "http://127.0.0.1:8080/api/healthz",
            "http://127.0.0.1:5173/",
          ];
          const deadline = Date.now() + 120000;
          while (Date.now() < deadline) {
            const checks = await Promise.all(
              urls.map(async (url) => {
                try {
                  const response = await fetch(url);
                  return response.ok;
                } catch {
                  return false;
                }
              }),
            );
            if (checks.every(Boolean)) process.exit(0);
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          console.error("E2E services did not become ready before the timeout.");
          process.exit(1);
          NODE

          if ! kill -0 "$worker_pid" 2>/dev/null; then
            echo "::error::Deployment worker exited before the E2E test started."
            exit 1
          fi

          pnpm test:e2e

      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployx-playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
