openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Workspace overview
  - name: projects
    description: Project management
  - name: repositories
    description: Git repository metadata
  - name: environments
    description: Environment variables
  - name: deployments
    description: Simulated deployment pipeline
  - name: notifications
    description: In-app notification center
  - name: openai
    description: OpenAI AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get workspace dashboard
      responses:
        "200":
          description: Dashboard metrics and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      responses:
        "204":
          description: Deleted
        "404":
          description: Project not found
  /projects/{projectId}/duplicate:
    post:
      operationId: duplicateProject
      tags: [projects]
      summary: Duplicate a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201":
          description: Duplicated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}/repository:
    get:
      operationId: getRepository
      tags: [repositories]
      summary: Get validated repository metadata
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Repository metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "404":
          description: Project not found
  /projects/{projectId}/environments:
    get:
      operationId: listEnvironmentVariables
      tags: [environments]
      summary: List environment variables
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: environment
          in: query
          required: false
          schema:
            type: string
            enum: [development, staging, production]
      responses:
        "200":
          description: Environment variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvironmentVariable"
    post:
      operationId: createEnvironmentVariable
      tags: [environments]
      summary: Add an environment variable
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentVariableInput"
      responses:
        "201":
          description: Created variable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentVariable"
  /projects/{projectId}/environments/{variableId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: variableId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateEnvironmentVariable
      tags: [environments]
      summary: Update an environment variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentVariableUpdate"
      responses:
        "200":
          description: Updated variable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentVariable"
    delete:
      operationId: deleteEnvironmentVariable
      tags: [environments]
      summary: Delete an environment variable
      responses:
        "204":
          description: Deleted
  /projects/{projectId}/deployments:
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: List deployment history
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Deployment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"
    post:
      operationId: createDeployment
      tags: [deployments]
      summary: Start an asynchronous deployment simulation
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Existing deployment returned for a repeated idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "202":
          description: Deployment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
  /deployments/{deploymentId}:
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: Get deployment progress and logs
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
  /deployments/{deploymentId}/rollback:
    post:
      operationId: rollbackDeployment
      tags: [deployments]
      summary: Simulate a rollback to this deployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Existing rollback returned for a repeated idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "202":
          description: Rollback started — returns the new deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "404":
          description: Deployment not found
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current user
      responses:
        "200":
          description: Notifications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Marked as read
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "204":
          description: All marked as read
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all AI assistant conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new AI assistant conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming SSE response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Reusing this key returns the original deployment instead of creating a duplicate.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProjectInput:
      type: object
      required: [name, repositoryUrl, branch, framework, environment]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        repositoryUrl: { type: string, minLength: 1 }
        branch: { type: string, minLength: 1 }
        framework: { type: string }
        environment:
          type: string
          enum: [development, staging, production]
        tags:
          type: array
          items: { type: string }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        branch: { type: string, minLength: 1 }
        framework: { type: string }
        environment:
          type: string
          enum: [development, staging, production]
        tags:
          type: array
          items: { type: string }
        archived: { type: boolean }
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required: [id, status, createdAt, updatedAt, lastDeployment]
          properties:
            id: { type: string }
            status:
              type: string
              enum: [active, archived]
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            lastDeployment:
              type: ["string", "null"]
    Repository:
      type: object
      required: [url, owner, name, defaultBranch, branches, lastCommit]
      properties:
        url: { type: string, minLength: 1 }
        owner: { type: string }
        name: { type: string }
        defaultBranch: { type: string }
        branches:
          type: array
          items: { type: string }
        lastCommit:
          type: object
          required: [sha, message, author, committedAt]
          properties:
            sha: { type: string }
            message: { type: string }
            author: { type: string }
            committedAt: { type: string, minLength: 1 }
    EnvironmentVariableInput:
      type: object
      required: [key, value, environment]
      properties:
        key: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
        value: { type: string }
        environment:
          type: string
          enum: [development, staging, production]
    EnvironmentVariableUpdate:
      type: object
      properties:
        value: { type: string }
        environment:
          type: string
          enum: [development, staging, production]
    EnvironmentVariable:
      type: object
      required: [id, projectId, key, maskedValue, environment, version, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        key: { type: string }
        maskedValue: { type: string }
        environment:
          type: string
          enum: [development, staging, production]
        version: { type: number }
        updatedAt: { type: string, format: date-time }
    Deployment:
      type: object
      required: [id, jobId, projectId, number, status, attempt, maxAttempts, progress, duration, triggeredBy, startedAt, steps, logs]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        projectId: { type: string }
        number: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [queued, running, success, failed]
        attempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        progress: { type: integer, minimum: 0, maximum: 100 }
        duration: { type: string }
        triggeredBy: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        steps:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status:
                type: string
                enum: [pending, running, success, failed]
        logs:
          type: array
          items: { type: string }
        failureReason: { type: ["string", "null"] }
    Dashboard:
      type: object
      required: [projects, deployments, successRate, averageDuration, activity, deployTrend]
      properties:
        projects:
          type: object
          required: [total, active, archived]
          properties:
            total: { type: number }
            active: { type: number }
            archived: { type: number }
        deployments:
          type: object
          required: [total, successful, running]
          properties:
            total: { type: number }
            successful: { type: number }
            running: { type: number }
        successRate: { type: number }
        averageDuration: { type: string }
        activity:
          type: array
          items:
            type: object
            required: [id, title, detail, time, tone]
            properties:
              id: { type: string }
              title: { type: string }
              detail: { type: string }
              time: { type: string }
              tone: { type: string }
        deployTrend:
          type: array
          items:
            type: object
            required: [day, deployments, successful]
            properties:
              day: { type: string }
              deployments: { type: number }
              successful: { type: number }
    OpenaiConversation:
      type: object
      required: [id, title, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string, format: date-time }
    OpenaiConversationInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
    OpenaiMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        role: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    OpenaiConversationWithMessages:
      type: object
      required: [id, title, createdAt, messages]
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
    OpenaiMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string }
    OpenaiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Notification:
      type: object
      required: [id, title, detail, tone, read, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        tone: { type: string, enum: [success, warning, info] }
        read: { type: boolean }
        projectId: { type: string }
        deploymentId: { type: string }
        createdAt: { type: string, format: date-time }

